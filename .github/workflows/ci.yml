name: ci

# Build and test a CLEAN CLONE of the package: the guarantee a public SPM owes its consumers (ForgeCore
# resolves this package by URL at a tag). Same shape as ForgeCore's and mlx-engine-swift's CI.
#
# BUILD SYSTEM (must stay pinned): the package links MLX, and MLX loads its Metal kernels from a
# `default.metallib` compiled from Cmlx's `.metal` sources into a resource bundle beside the test binary.
# Only the `swiftbuild` build system compiles those sources; the deprecated `native` one ships no metallib,
# so the first allocator call aborts the whole xctest process (signal 5) while the log can still read
# "all tests passed" — the trap that once had mlx-engine-swift's CI green while broken. Do not remove it.
#
# WHAT RUNS HERE, on the CPU stream and entirely from the repository: the S0 key contract and parameter
# counts for all five vendored checkpoints; the S1 per-sub-op parity gates and the end-to-end check of every
# checkpoint against torch AND the author's ONNX, both from the committed upstream fixture
# `goldens_s1_37x53.safetensors`; the pixel-shuffle and bicubic probes; and the offline conformance suites
# (C0–C14 surface, MAT-1..5 on the bundled weights, CAN-1..3, inference mode) plus the live CPU package
# tests (halo tiling == whole frame, progress per tile, cancellation within one tile). The GPU lanes
# (`nerve-smoke gate … --gpu`, perf) need an idle Apple GPU and run locally — see PORTING-SPEC.md.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Toolchain
        run: |
          sw_vers
          swift --version
          # Informational: the metallib compile needs this component. The suites run on the CPU stream.
          xcodebuild -showComponent MetalToolchain || echo "MetalToolchain component not reported"
      - name: Build (all products)
        run: swift build --build-system swiftbuild
      - name: Test
        run: swift test --build-system swiftbuild
